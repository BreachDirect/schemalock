[package]
name = "schemalock"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
description = "Declarative API contract test harness for Stellar backends (Rust port of the Phase 1 Python implementation)"
license = "MIT"

[lib]
name = "schemalock"
path = "src/lib.rs"

[[bin]]
name = "schemalock"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
