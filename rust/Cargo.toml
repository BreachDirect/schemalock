[package]
name = "schemalock"
version = "0.1.0"
edition = "2021"
description = "Declarative API contract test harness for Stellar backends (Rust port of the Phase 1 Python implementation)"
license = "MIT"

[lib]
name = "schemalock"
path = "src/lib.rs"

[[bin]]
name = "schemalock"
path = "src/main.rs"

[dependencies]
ureq = { version = "=2.9.7", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "=0.9.25"
clap = { version = "=4.4.18", features = ["derive"] }
indexmap = "=2.2.6"
url = "=2.4.1"
idna = "=0.4.0"
