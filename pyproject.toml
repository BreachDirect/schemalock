[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schemalock"
version = "0.1.0"
description = "Declarative API contract test harness — locks error envelopes, auth boundaries, and status code contracts for Stellar backend services."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BreachDirect" }]
keywords = ["api", "contract-testing", "stellar", "ci", "testing"]
dependencies = [
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ruff==0.16.2",
]

[project.scripts]
schemalock = "schemalock.cli:main"

[tool.setuptools.packages.find]
include = ["schemalock*"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["schemalock", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
