name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SchemaLock (with dev deps)
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r <(pip freeze --exclude pip-audit)

      - name: Run test suite
        run: pytest tests/ -v

      - name: Smoke test — CLI against bundled example (correct contract)
        run: |
          uvicorn examples.mock_server:app --port 8000 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
          schemalock test --config examples/escrow_api.yaml --base-url http://127.0.0.1:8000 --json-report report.json

      - name: Smoke test — CLI catches a broken contract (must fail)
        run: |
          pkill -f "uvicorn examples.mock_server" || true
          sleep 1
          MOCK_BREAK_CONTRACT=1 uvicorn examples.mock_server:app --port 8001 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8001/health && break; sleep 0.5; done
          if schemalock test --config examples/escrow_api.yaml --base-url http://127.0.0.1:8001; then
            echo "expected SchemaLock to fail against a broken contract, but it passed" >&2
            exit 1
          else
            echo "confirmed: SchemaLock correctly failed against the broken contract"
          fi

      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        with:
          name: schemalock-report-${{ matrix.python-version }}
          path: report.json

  parity:
    name: Cross-language parity (Python vs Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SchemaLock (dev deps incl. mock server)
        run: pip install -e ".[dev]"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Build Rust binary (locked to committed Cargo.lock)
        working-directory: rust
        run: cargo build --locked

      - name: Verify Python and Rust reports are identical
        run: python3 scripts/parity_check.py --rust-binary rust/target/debug/schemalock
