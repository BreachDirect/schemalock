name: Rust CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint with warnings denied
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.2 --locked
      - name: Run cargo audit
        working-directory: rust
        run: cargo audit

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny@0.20.2 --locked
      - name: Run cargo deny
        working-directory: rust
        run: cargo deny check

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set up Python (for the shared mock server used by e2e tests)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps (mock server only)
        run: pip install -e ".[dev]"

      - name: Build (locked to committed Cargo.lock)
        working-directory: rust
        run: cargo build --locked

      - name: Run test suite (unit + e2e against the shared mock server)
        working-directory: rust
        run: cargo test --locked

      - name: Smoke test — CLI against bundled example (correct contract)
        run: |
          uvicorn examples.mock_server:app --port 8010 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8010/health && break; sleep 0.5; done
          ./rust/target/debug/schemalock test --config examples/escrow_api.yaml --base-url http://127.0.0.1:8010

      - name: Smoke test — CLI catches a broken contract (must fail)
        run: |
          pkill -f "uvicorn examples.mock_server" || true
          sleep 1
          MOCK_BREAK_CONTRACT=1 uvicorn examples.mock_server:app --port 8011 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8011/health && break; sleep 0.5; done
          if ./rust/target/debug/schemalock test --config examples/escrow_api.yaml --base-url http://127.0.0.1:8011; then
            echo "expected SchemaLock (Rust) to fail against a broken contract, but it passed" >&2
            exit 1
          else
            echo "confirmed: SchemaLock (Rust) correctly failed against the broken contract"
          fi
