name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & publish tagged release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust binary
        working-directory: rust
        run: cargo build --release --locked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Package artifacts + checksums
        run: |
          cp rust/target/release/schemalock schemalock-x86_64-unknown-linux-gnu
          sha256sum schemalock-x86_64-unknown-linux-gnu dist/*.tar.gz dist/*.whl > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            schemalock-x86_64-unknown-linux-gnu
            dist/*.tar.gz
            dist/*.whl
            SHA256SUMS
          generate_release_notes: true
